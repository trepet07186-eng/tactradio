<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ТАКТИК-РАДИО</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d110e">
  <script src="https://unpkg.com"></script>
  <style>
    :root {
      --bg: #0d110e; --panel: #161d18; --border: #2c3a30;
      --green: #4af626; --amber: #ffb000; --red: #ff3b30;
      --text: #c8d6cb; --muted: #627567;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Courier New', monospace; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    .header { background: #111612; border-bottom: 2px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .title { font-weight: bold; letter-spacing: 2px; color: var(--green); font-size: 16px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); display: inline-block; margin-right: 6px; }
    .status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    #login-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px; gap: 16px; }
    label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    input { width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--green); padding: 14px; font-size: 18px; font-weight: bold; border-radius: 4px; outline: none; text-transform: uppercase; }
    input:focus { border-color: var(--green); }
    .btn-primary { background: #1f3323; border: 2px solid var(--green); color: var(--green); padding: 16px; font-size: 16px; font-weight: bold; letter-spacing: 2px; border-radius: 4px; cursor: pointer; margin-top: 8px; }
    .btn-primary:active { background: var(--green); color: #000; }
    #radio-screen { display: none; flex: 1; flex-direction: column; justify-content: space-between; padding: 16px; }
    .lcd-display { background: #182219; border: 2px solid #2e4031; border-radius: 6px; padding: 14px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
    .lcd-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .freq-code { font-size: 22px; font-weight: bold; color: var(--green); letter-spacing: 2px; }
    .mode-badge { padding: 4px 10px; border-radius: 3px; font-weight: bold; font-size: 14px; background: #0d110e; border: 1px solid var(--border); color: var(--muted); }
    .mode-badge.tx { background: var(--red); color: #000; border-color: var(--red); box-shadow: 0 0 12px var(--red); }
    .mode-badge.rx { background: var(--amber); color: #000; border-color: var(--amber); box-shadow: 0 0 12px var(--amber); }
    .speaker-info { font-size: 14px; color: var(--amber); min-height: 20px; margin-top: 6px; font-weight: bold; }
    .log-box { background: #090c0a; border: 1px solid var(--border); border-radius: 4px; height: 110px; overflow-y: auto; padding: 8px; font-size: 12px; color: var(--muted); }
    .log-box div { margin-bottom: 4px; }
    .log-box .sys { color: var(--green); }
    .log-box .warn { color: var(--amber); }
    .ptt-zone { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px 0; }
    #ptt-btn { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #2a332c, #121713); border: 6px solid #38473c; color: var(--text); font-size: 20px; font-weight: bold; letter-spacing: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.1); touch-action: none; cursor: pointer; }
    #ptt-btn.active { border-color: var(--red); color: var(--red); background: radial-gradient(circle at 50% 50%, #3a1515, #170808); box-shadow: 0 0 35px rgba(255, 59, 48, 0.5), inset 0 4px 12px rgba(0,0,0,0.9); transform: scale(0.97); }
    #ptt-btn.busy { border-color: var(--amber); color: var(--amber); opacity: 0.7; }
    .ptt-sub { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .footer-controls { display: flex; justify-content: space-between; gap: 10px; }
    .btn-disconnect { flex: 1; background: #261414; border: 1px solid #5c2828; color: #ff6b6b; padding: 12px; font-size: 13px; font-weight: bold; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Р-187 // ТАКТИК</div>
    <div><span id="conn-dot" class="status-dot"></span><span id="conn-text" style="font-size:12px;">ОТКЛ</span></div>
  </div>
  <div id="login-screen">
    <div><label>Ваш позывной</label><input type="text" id="callsign-input" placeholder="НАПР: АЛМАЗ-1" maxlength="16"></div>
    <div><label>Ключ-частота (Название группы)</label><input type="text" id="channel-input" placeholder="НАПР: СЕКТОР-7" maxlength="24"></div>
    <button class="btn-primary" id="connect-btn">ВЫЙТИ НА СВЯЗЬ</button>
    <div style="font-size: 11px; color: var(--muted); line-height: 1.4;">* Все участники с одинаковым названием группы попадают на одну закрытую частоту.</div>
  </div>
  <div id="radio-screen">
    <div class="lcd-display">
      <div class="lcd-row">
        <div class="freq-code" id="display-channel">---</div>
        <div class="mode-badge" id="mode-badge">ОЖИДАНИЕ</div>
      </div>
      <div style="font-size: 12px; color: var(--muted);">ПОЗЫВНОЙ: <span id="display-callsign" style="color:var(--text)">---</span></div>
      <div class="speaker-info" id="speaker-status">ЭФИР ЧИСТ</div>
    </div>
    <div class="ptt-zone">
      <button id="ptt-btn"><span>ПЕРЕДАЧА</span><span class="ptt-sub">УДЕРЖИВАТЬ (PTT)</span></button>
    </div>
    <div class="log-box" id="log-box"></div>
    <div class="footer-controls" style="margin-top: 12px;">
      <button class="btn-disconnect" id="disconnect-btn">ОТКЛЮЧИТЬ РАЦИЮ (ВЫКЛ)</button>
    </div>
  </div>
  <audio id="bg-keepalive" loop playsinline></audio>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  let client = null, audioCtx = null, micStream = null, mediaRecorder = null;
  let isTransmitting = false, currentSpeaker = null, speakerTimeout = null;
  let myCallsign = '', topicBase = '', wakeLock = null;
  let audioQueue = [], isPlayingQueue = false;

  document.getElementById('callsign-input').value = localStorage.getItem('radio_callsign') || '';
  document.getElementById('channel-input').value = localStorage.getItem('radio_channel') || '';

  function addLog(msg, type = '') {
    const box = document.getElementById('log-box');
    const time = new Date().toLocaleTimeString('ru-RU', { hour12: false });
    const div = document.createElement('div');
    if (type) div.className = type;
    div.textContent = `[${time}] ${msg}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function playRadioTone(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'ptt_start') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.05);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'roger_beep') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1250, now);
      osc.frequency.setValueAtTime(1600, now + 0.06);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.start(now); osc.stop(now + 0.14);
    }
  }

  async function hashChannel(name) {
    const data = new TextEncoder().encode('tactic_radio_v1_' + name.trim().toUpperCase());
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 24);
  }

  function startBackgroundKeepAlive(channelName) {
    const sampleRate = 8000, numSamples = sampleRate;
    const buffer = new ArrayBuffer(44 + numSamples * 2);
    const view = new DataView(buffer);
    const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
    writeStr(0, 'RIFF'); view.setUint32(4, 36 + numSamples * 2, true);
    writeStr(8, 'WAVE'); writeStr(12, 'fmt '); view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    writeStr(36, 'data'); view.setUint32(40, numSamples * 2, true);

    const blob = new Blob([buffer], { type: 'audio/wav' });
    const audioEl = document.getElementById('bg-keepalive');
    audioEl.src = URL.createObjectURL(blob);
    audioEl.volume = 0.01;
    audioEl.play().catch(() => {});

    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: `ЧАСТОТА: ${channelName}`,
        artist: `ПОЗЫВНОЙ: ${myCallsign} (АКТИВНО)`
      });
      navigator.mediaSession.setActionHandler('play', () => startTX());
      navigator.mediaSession.setActionHandler('pause', () => stopTX());
      navigator.mediaSession.setActionHandler('stop', () => disconnectRadio());
    }
  }
  document.getElementById('connect-btn').addEventListener('click', async () => {
    const callsign = document.getElementById('callsign-input').value.trim().toUpperCase();
    const channel = document.getElementById('channel-input').value.trim().toUpperCase();
    if (!callsign || !channel) { alert('Укажите позывной и название группы!'); return; }

    localStorage.setItem('radio_callsign', callsign);
    localStorage.setItem('radio_channel', channel);
    myCallsign = callsign;

    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
    } catch (e) {
      alert('Нет доступа к микрофону! Проверьте HTTPS и разрешения.');
      return;
    }

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('radio-screen').style.display = 'flex';
    document.getElementById('display-channel').textContent = channel;
    document.getElementById('display-callsign').textContent = myCallsign;

    startBackgroundKeepAlive(channel);
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(wl => wakeLock = wl).catch(() => {});

    const hash = await hashChannel(channel);
    topicBase = `tactic_radio_net/${hash}`;

    addLog('Подключение к узлу связи...', 'sys');
    client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: 'rad_' + Math.random().toString(16).slice(2, 10),
      keepalive: 20
    });

    client.on('connect', () => {
      document.getElementById('conn-dot').classList.add('online');
      document.getElementById('conn-text').textContent = 'В СЕТИ';
      client.subscribe(`${topicBase}/audio`);
      client.subscribe(`${topicBase}/ctrl`);
      client.publish(`${topicBase}/ctrl`, JSON.stringify({ type: 'join', sender: myCallsign }));
      addLog(`Частота [${channel}] активна.`, 'sys');
    });

    client.on('offline', () => {
      document.getElementById('conn-dot').classList.remove('online');
      document.getElementById('conn-text').textContent = 'ПОИСК...';
      addLog('Потеря связи, переподключение...', 'warn');
    });

    client.on('message', (topic, payload) => {
      const data = JSON.parse(payload.toString());
      if (data.sender === myCallsign) return;
      if (topic.endsWith('/ctrl')) {
        if (data.type === 'join') addLog(`${data.sender} вышел на частоту.`);
        if (data.type === 'tx_end') { playRadioTone('roger_beep'); resetRX(); }
      } else if (topic.endsWith('/audio')) {
        handleIncomingAudio(data.sender, data.audio);
      }
    });
  });

  function handleIncomingAudio(sender, base64Audio) {
    if (isTransmitting) return;
    currentSpeaker = sender;
    const badge = document.getElementById('mode-badge');
    badge.textContent = 'ПРИЕМ (RX)';
    badge.className = 'mode-badge rx';
    document.getElementById('speaker-status').textContent = `ГОВОРИТ: ${sender}`;
    document.getElementById('ptt-btn').classList.add('busy');

    clearTimeout(speakerTimeout);
    speakerTimeout = setTimeout(resetRX, 2000);

    audioQueue.push(base64Audio);
    if (!isPlayingQueue) playNextChunk();
  }

  function playNextChunk() {
    if (audioQueue.length === 0) { isPlayingQueue = false; return; }
    isPlayingQueue = true;
    const b64 = audioQueue.shift();
    const snd = new Audio('data:audio/webm;codecs=opus;base64,' + b64);
    snd.onended = playNextChunk;
    snd.onerror = playNextChunk;
    snd.play().catch(playNextChunk);
  }

  function resetRX() {
    currentSpeaker = null;
    if (!isTransmitting) {
      const badge = document.getElementById('mode-badge');
      badge.textContent = 'ОЖИДАНИЕ';
      badge.className = 'mode-badge';
      document.getElementById('speaker-status').textContent = 'ЭФИР ЧИСТ';
      document.getElementById('ptt-btn').classList.remove('busy');
    }
  }

  function startTX() {
    if (isTransmitting || !client || !client.connected) return;
    if (currentSpeaker) { addLog(`Канал занят (${currentSpeaker})!`, 'warn'); return; }
    if (audioCtx.state === 'suspended') audioCtx.resume();

    isTransmitting = true;
    playRadioTone('ptt_start');
    if (navigator.vibrate) navigator.vibrate(40);

    document.getElementById('ptt-btn').classList.add('active');
    const badge = document.getElementById('mode-badge');
    badge.textContent = 'ПЕРЕДАЧА (TX)';
    badge.className = 'mode-badge tx';
    document.getElementById('speaker-status').textContent = 'ВЫ В ЭФИРЕ...';

    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
    mediaRecorder = new MediaRecorder(micStream, mimeType ? { mimeType, audioBitsPerSecond: 16000 } : {});

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0 && isTransmitting) {
        const reader = new FileReader();
        reader.onloadend = () => {
          const idx = reader.result.indexOf(',');
          if (idx !== -1) {
            const b64data = reader.result.slice(idx + 1);
            client.publish(`${topicBase}/audio`, JSON.stringify({ sender: myCallsign, audio: b64data }));
          }
        };
        reader.readAsDataURL(e.data);
      }
    };
    mediaRecorder.start(450);
  }

  function stopTX() {
    if (!isTransmitting) return;
    isTransmitting = false;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    playRadioTone('roger_beep');
    if (navigator.vibrate) navigator.vibrate();

    document.getElementById('ptt-btn').classList.remove('active');
    resetRX();
    if (client && client.connected) {
      client.publish(`${topicBase}/ctrl`, JSON.stringify({ type: 'tx_end', sender: myCallsign }));
    }
  }

  const pttBtn = document.getElementById('ptt-btn');
  pttBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startTX(); });
  window.addEventListener('pointerup', () => { if (isTransmitting) stopTX(); });
  pttBtn.addEventListener('pointercancel', () => { if (isTransmitting) stopTX(); });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'AudioVolumeDown' || e.code === 'AudioVolumeUp' || e.code === 'Space') {
      e.preventDefault();
      if (!e.repeat) startTX();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'AudioVolumeDown' || e.code === 'AudioVolumeUp' || e.code === 'Space') {
      e.preventDefault();
      stopTX();
    }
  });

  function disconnectRadio() {
    if (!confirm('Отключить рацию и выйти из эфира?')) return;
    stopTX();
    if (client) client.end();
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    if (wakeLock) wakeLock.release().catch(() => {});
    document.getElementById('bg-keepalive').pause();
    location.reload();
  }
  document.getElementById('disconnect-btn').addEventListener('click', disconnectRadio);
</script>
</body>
</html>
