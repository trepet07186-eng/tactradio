<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ТАКТИК-РАДИО</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d110e">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.5/mqtt.min.js"></script>
  <style>
    :root { --bg:#0d110e; --panel:#161d18; --border:#2c3a30; --green:#4af626; --amber:#ffb000; --red:#ff3b30; --text:#c8d6cb; --muted:#627567; }
    * { box-sizing:border-box; user-select:none; -webkit-user-select:none; font-family:'Courier New',monospace; }
    body { margin:0; pagding:0; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    .header { background:#111612; border-bottom:2px solid var(--border); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
    .title { font-weight:bold; letter-spacing:2px; color:var(--green); font-size:16px; }
    .status-dot { width:10px; height:10px; border-radius:50%; background:var(--red); display:inline-block; margin-right:6px; }
    .status-dot.online { background:var(--green); box-shadow:0 0 8px var(--green); }
    #login-screen { flex:1; display:flex; flex-direction:column; justify-content:center; padding:24px; gap:16px; }
    label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
    input { width:100%; background:var(--panel); border:1px solid var(--border); color:var(--green); padding:14px; font-size:18px; font-weight:bold; border-radius:4px; outline:none; text-transform:uppercase; }
    .btn-primary { background:#1f3323; border:2px solid var(--green); color:var(--green); padding:16px; font-size:16px; font-weight:bold; letter-spacing:2px; border-radius:4px; cursor:pointer; margin-top:8px; }
    .btn-primary:active { background:var(--green); color:#000; }

    #radio-screen { display:none; flex:1; display:none; flex-direction:column; justify-content:space-between; padding:16px; }
    .lcd-display { background:#182219; border:2px solid #2e4031; border-radius:6px; padding:14px; box-shadow:inset 0 0 20px rgba(0,0,0,0.8); }
    .lcd-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .freq-code { font-size:22px; font-weight:bold; color:var(--green); letter-spacing:2px; }
    .mode-badge { padding:4px 10px; border-radius:3px; font-weight:bold; font-size:14px; background:#0d110e; border:1px solid var(--border); color:var(--muted); }
    .mode-badge.tx { background:var(--red); color:#000; border-color:var(--red); box-shadow:0 0 12px var(--red); }
    .mode-badge.rx { background:var(--amber); color:#000; border-color:var(--amber); box-shadow:0 0 12px var(--amber); }
    .speaker-info { font-size:14px; color:var(--amber); min-height:20px; margin-top:6px; font-weight:bold; }
    .log-box { background:#090c0a; border:1px solid var(--border); border-radius:4px; height:130px; overflow-y:auto; padding:8px; font-size:12px; color:var(--muted); }
    .log-box div { margin-bottom:4px; }
    .log-box .sys { color:var(--green); }
    .log-box .warn { color:var(--amber); }
    .log-box .err { color:var(--red); }
    .ptt-zone { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:12px 0; }
    #ptt-btn { width:210px; height:210px; border-radius:50%; background:radial-gradient(circle at 30% 30%,#2i332c,#121713); border:6px solid #38473c; color:var(--text); font-size:20px; font-weight:bold; letter-spacing:2px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 10px 25px rgba(0,0,0,0.8); touch-action:none; cursor:pointer; }
    #ptt-btn.active { border-color:var(--red); color:var(--red); background:radial-gradient(circle at 50% 50%,#3a1515,#170808); box-shadow:0 0 35px rgba(255,59,48,0.5); transform:scale(0.97); }
    #ptt-btn.busy { border-color:var(--amber); color:var(--amber); opacity:0.7; }
    .ptt-sub { font-size:11px; color:var(--muted); margin-top:8px; }
    .btn-disconnect { width:100%; background:#261414; border:1px solid #5c2828; color:#ff6b6b; padding:12px; font-size:13px; font-weight:bold; border-radius:4px; cursor:pointer; margin-top:12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Р-187 // ТАКТИК v1.2</div>
    <div><span id="conn-dot" class="status-dot"></span><span id="conn-text" style="font-size:12px;">ОТКЛ</span></div>
  </div>
  <div id="login-screen">
    <div><label>Ваш позывной</label><input type="text" id="callsign-input" placeholder="НАПР: АЛМАЗ-1" maxlength="16"></div>
    <div><label>Ключ-частота (Название группы/)</label><input type="text" id="channel-input" placeholder="НАПР: СЕКТОР-7" maxlength="24"></div>
    <button class="btn-primary" id="connect-btn">ВЫЙТИ НА СВЯЗЬ</button>
  </div>
  <div id="radio-screen">
    <div class="lcd-display">
      <div class="lcd-row"><div class="freq-code" id="display-channel">---</div><div class="mode-badge" id="mode-badge">ОЖИДАНИЕ</div></div>
      <div style="font-size:12px;color:var(--muted);">ПОЗЫВНОЙ: <span id="display-callsign" style="color:var(--text)">---</span></div>
      <div class="speaker-info" id="speaker-status">ЭФИР ЧИСТ</div>
    </div>
    <div class="ptt-zone"><button id="ptt-btn"><span>ПЕРЕДАЧА</span><span class="ptt-sub">УДЕРЖИВАТЬ (PTT)</span></button></div>
    <div class="log-box" id="log-box"></div>
    <button class="btn-disconnect" id="disconnect-btn">ОТКЛЮЧИТЬ РАЦИЮ (ВЫКЛ)</button>
  </div>
  <audio id="bg-keepalive" loop playsinline></audio>
<script>
let client=null,audioCtx=null,micStream=null,mediaRecorder=null;
let isTX=false,speaker=null,rxTimer=null,myCall="",topic="",wl=null;
let q=[],playing=false,bIdx=0;
const NODES=[
  {n:"HiveMQ",u:"wss://://hivemq.com"},
  {n:"Mosquitto",u:"wss://test.mosquitto.org:8081/mqtt"},
  {n:"EMQX",u:"wss://broker.emqx.io:8084/mqtt"}
];
const $=id=>document.getElementById(id);
$("callsign-input").value=localStorage.getItem("r_cs")||"";
$("channel-input").value=localStorage.getItem("r_ch")||"";
function log(m,c=""){
  const b=$("log-box"),d=document.createElement("div");
  if(c)d.className=c;
  d.textContent="["+new Date().toLocaleTimeString()+"] "+m;
  b.appendChild(d);b.scrollTop=b.scrollHeight;
}
function beep(t){
  if(!audioCtx)return;
  const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  if(t===1){o.type="square";o.frequency.setValueAtTime(180,n);o.frequency.exponentialRampToValueAtTime(90,n+0.05);g.gain.setValueAtTime(0.15,n);g.gain.exponentialRampToValueAtTime(0.01,n+0.05);o.start(n);o.stop(n+0.05);}
  else{o.type="sine";o.frequency.setValueAtTime(1250,n);o.frequency.setValueAtTime(1600,n+0.06);g.gain.setValueAtTime(0.12,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.14);o.start(n);o.stop(n+0.14);}
}
async function getHash(s){
  const d=new TextEncoder().encode("tr1_"+s.trim().toUpperCase());
  const h=await crypto.subtle.digest("SHA-256",d);
  return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,24);
}
function keepBg(ch){
  const sr=8000,buf=new ArrayBuffer(44+sr*2),v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,"RIFF");v.setUint32(4,36+sr*2,true);ws(8,"WAVE");ws(12,"fmt ");
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  ws(36,"data");v.setUint32(40,sr*2,true);
  const el=$("bg-keepalive");el.src=URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
  el.volume=0.01;el.play().catch(()=>{});
  if("mediaSession"in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:"CH: "+ch,artist:myCall});
    navigator.mediaSession.setActionHandler("play",()=>startTX());
    navigator.mediaSession.setActionHandler("pause",()=>stopTX());
  }
}
function connectNode(ch){
  if(typeof mqtt==="undefined"){log("Ошибка загрузки MQTT","err");return;}
  const nd=NODES[bIdx%NODES.length];log("Подключение: "+nd.n+"...","warn");
  if(client){try{client.end(true);}catch(e){}}
  client=mqtt.connect(nd.u,{clientId:"r_"+Math.random().toString(16).slice(2,9),keepalive:20,connectTimeout:5000,reconnectPeriod:0});
  const tm=setTimeout(()=>{if(!client||!client.connected){log(nd.n+" не отвечает, смена...","err");bIdx++;connectNode(ch);}},5500);
  client.on("connect",()=>{
    clearTimeout(tm);$("conn-dot").classList.add("online");$("conn-text").textContent="В СЕТИ";
    client.subscribe(topic+"/a");client.subscribe(topic+"/c");
    client.publish(topic+"/c",JSON.stringify({t:"j",s:myCall}));
    log("СВЯЗЬ ЕСТЬ ("+nd.n+")","sys");
  });
  client.on("close",()=>{$("conn-dot").classList.remove("online");$("conn-text").textContent="ПОИСК...";});
  client.on("message",(tp,pl)=>{
    const d=JSON.parse(pl.toString());if(d.s===myCall)return;
    if(tp.endsWith("/c")){if(d.t==="j")log(d.s+" в сети");if(d.t==="e"){beep(2);resetRX();}}
    else if(tp.endsWith("/a"))onAudio(d.s,d.a);
  });
}
$("connect-btn").onclick=async()=>{
  const cs=$("callsign-input").value.trim().toUpperCase(),ch=$("channel-input").value.trim().toUpperCase();
  if(!cs||!ch){alert("Введите позывной и группу!");return;}
  localStorage.setItem("r_cs",cs);localStorage.setItem("r_ch",ch);myCall=cs;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(e){alert("Нет доступа к микрофону!");return;}
  $("login-screen").style.display="none";$("radio-screen").style.display="flex";
  $("display-channel").textContent=ch;$("display-callsign").textContent=myCall;
  keepBg(ch);if("wakeLock"in navigator)navigator.wakeLock.request("screen").then(w=>wl=w).catch(()=>{});
  topic="tr_net/"+await getHash(ch);connectNode(ch);
};
function onAudio(s,b64){
  if(isTX)return;speaker=s;const bg=$("mode-badge");bg.textContent="ПРИЕМ (RX)";bg.className="mode-badge rx";
  $("speaker-status").textContent="ГОВОРИТ: "+s;$("ptt-btn").classList.add("busy");
  clearTimeout(rxTimer);rxTimer=setTimeout(resetRX,2000);q.push(b64);if(!playing)playQ();
}
function playQ(){if(!q.length){playing=false;return;}playing=true;const a=new Audio("data:audio/webm;codecs=opus;base64,"+q.shift());a.onended=playQ;a.onerror=playQ;a.play().catch(playQ);}
function resetRX(){speaker=null;if(!isTX){const bg=$("mode-badge");bg.textContent="ОЖИДАНИЕ";bg.className="mode-badge";$("speaker-status").textContent="ЭФИР ЧИСТ";$("ptt-btn").classList.remove("busy");}}
function startTX(){
  if(isTX||!client||!client.connected)return;if(speaker){log("Занято: "+speaker,"warn");return;}
  if(audioCtx.state==="suspended")audioCtx.resume();isTX=true;beep(1);if(navigator.vibrate)navigator.vibrate(40);
  $("ptt-btn").classList.add("active");const bg=$("mode-badge");bg.textContent="ПЕРЕДАЧА (TX)";bg.className="mode-badge tx";$("speaker-status").textContent="ВЫ В ЭФИРЕ...";
  const mt=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"";
  mediaRecorder=new MediaRecorder(micStream,mt?{mimeType:mt,audioBitsPerSecond:16000}:{});
  mediaRecorder.ondataavailable=e=>{if(e.data.size>0&&isTX){const r=new FileReader();r.onloadend=()=>{const i=r.result.indexOf(",");if(i!==-1)client.publish(topic+"/a",JSON.stringify({s:myCall,a:r.result.slice(i+1)}));};r.readAsDataURL(e.data);}};
  mediaRecorder.start(450);
}
function stopTX(){
  if(!isTX)return;isTX=false;if(mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop();beep(2);
  $("ptt-btn").classList.remove("active");resetRX();if(client&&client.connected)client.publish(topic+"/c",JSON.stringify({t:"e",s:myCall}));
}
const ptt=$("ptt-btn");ptt.onpointerdown=e=>{e.preventDefault();startTX();};window.onpointerup=()=>{if(isTX)stopTX();};ptt.onpointercancel=()=>{if(isTX)stopTX();};
$("disconnect-btn").onclick=()=>{if(!confirm("Отключить рацию?"))return;stopTX();if(client)client.end();if(micStream)micStream.getTracks().forEach(t=>t.stop());location.reload();};
</script></body></html>
