<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Рация ПВО (PTT)</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body, html { margin: 0; padding: 0; height: 100dvh; width: 100%; background: #0d1117; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
    .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
    .title { font-weight: 800; font-size: 15px; color: #4ade80; letter-spacing: 0.5px; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 12px; background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .badge.online { background: #14532d; color: #4ade80; border-color: #22c55e; }
    .badge.rx { background: #1d4ed8; color: #fff; border-color: #60a5fa; }
    .badge.tx { background: #7f1d1d; color: #fca5a5; border-color: #ef4444; }
    .setup-bar { background: #131820; border-bottom: 1px solid #26303d; padding: 8px 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    input { background: #090d12; color: #ffd23f; border: 1px solid #3b4758; border-radius: 7px; padding: 7px 9px; font-size: 13px; font-weight: 700; outline: none; }
    input::placeholder { color: #64748b; font-weight: 400; }
    .btn { background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 7px; padding: 7px 11px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn.green { background: #15803d; border-color: #22c55e; }
    .btn.red { background: #7f1d1d; border-color: #ef4444; }
    .log-area { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 7px; }
    .msg-item { background: #161d26; border-left: 4px solid #38bdf8; border-radius: 6px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .msg-item.mine { border-left-color: #4ade80; background: #11221a; }
    .msg-item.playing { border-color: #f59e0b; background: #291d0c; box-shadow: 0 0 10px rgba(245,158,11,0.3); }
    .ptt-zone { background: #12171f; border-top: 1px solid #2d3748; padding: 14px 16px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .vu-wrap { width: 100%; max-width: 340px; height: 8px; background: #090d12; border-radius: 4px; overflow: hidden; border: 1px solid #26303d; }
    .vu-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #22c55e, #eab308, #ef4444); transition: width 0.06s; }
    .ptt-btn { width: 185px; height: 185px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #1e293b, #0f172a); border: 4px solid #38bdf8; color: #f8fafc; font-size: 15px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); touch-action: none; cursor: pointer; transition: transform 0.08s, border-color 0.1s; }
    .ptt-btn:disabled { opacity: 0.4; border-color: #475569; cursor: not-allowed; }
    .ptt-btn.active { transform: scale(0.95); background: radial-gradient(circle at 35% 35%, #991b1b, #450a0a); border-color: #ef4444; box-shadow: 0 0 30px rgba(239,68,68,0.65); color: #fff; }
    .ptt-btn.receiving { border-color: #22c55e; box-shadow: 0 0 25px rgba(34,197,94,0.45); }
    .hint { font-size: 12px; color: #94a3b8; text-align: center; min-height: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">📻 РАЦИЯ ПВО [AES-256]</div>
    <div id="netBadge" class="badge">ОФЛАЙН</div>
  </div>
  <div class="setup-bar">
    <input id="inCall" placeholder="Позывной (МОГ-1)" style="flex:1; min-width:110px;" />
    <input id="inRoom" placeholder="Канал (333)" value="333" style="width:95px;" />
    <button id="btnConnect" class="btn green">В эфир</button>
    <button id="btnClear" class="btn red" title="Очистить эфир и облако">Сброс</button>
  </div>
  <div id="logList" class="log-area">
    <div style="color:#64748b; font-size:12px; text-align:center; margin-top:20px;">Введите позывной и код канала, затем нажмите «В эфир» для активации микрофона и динамика.</div>
  </div>
  <div class="ptt-zone">
    <div class="vu-wrap"><div id="vuBar" class="vu-bar"></div></div>
    <div id="statusHint" class="hint">Ожидание подключения к каналу...</div>
    <button id="btnPtt" class="ptt-btn" disabled>
      <span style="font-size:34px;">🎙</span>
      <span id="pttMainTxt">ПЕРЕДАЧА</span>
      <span id="pttSubTxt" style="font-size:11px; color:#94a3b8; font-weight:600;">УДЕРЖИВАТЬ</span>
    </button>
  </div>
  <script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js");}</script>
  <script src="app.js?v=2"></script>
</body>
</html>
